services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: space-health-monitor:latest
    container_name: space-health-monitor
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
