<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="banner-title banner-description">
  <title id="banner-title">ORBITA</title>
  <desc id="banner-description">Offline-first crew health telemetry and onboard decision support for deep-space missions.</desc>
  <defs>
    <linearGradient id="banner-wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="banner-glow" cx="52%" cy="50%" r="62%">
      <stop offset="0" stop-color="#0E7490" stop-opacity=".24"/>
      <stop offset="1" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
    <pattern id="banner-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22D3EE" stroke-opacity=".09" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.3" fill="#10B981" fill-opacity=".26"/>
    </pattern>
    <linearGradient id="mark-gradient" gradientUnits="userSpaceOnUse" x1="70" y1="440" x2="450" y2="70">
      <stop offset="0" stop-color="#3FB2FF"/>
      <stop offset="1" stop-color="#9B6BFF"/>
    </linearGradient>
    <linearGradient id="mark-orbit-gradient" gradientUnits="userSpaceOnUse" gradientTransform="rotate(18 256 256)" x1="70" y1="440" x2="450" y2="70">
      <stop offset="0" stop-color="#3FB2FF"/>
      <stop offset="1" stop-color="#9B6BFF"/>
    </linearGradient>
    <clipPath id="mark-front">
      <rect x="0" y="256" width="512" height="256"/>
    </clipPath>
  </defs>

  <rect width="1200" height="320" fill="#050811"/>
  <rect width="1200" height="320" fill="url(#banner-glow)"/>
  <rect width="1200" height="320" fill="url(#banner-grid)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M-50 248C110 60 372 48 548 162S924 314 1256 74" stroke="#22D3EE" stroke-opacity=".13" stroke-width="1.5"/>
    <path d="M-30 279C162 111 359 95 525 197S923 347 1240 119" stroke="#10B981" stroke-opacity=".12" stroke-width="1"/>
    <path d="M1010-58A250 250 0 0 1 1248 204" stroke="#22D3EE" stroke-opacity=".14" stroke-width="1"/>
    <path d="M1050-82A300 300 0 0 1 1322 215" stroke="#10B981" stroke-opacity=".1" stroke-width="1"/>
    <path d="M469 39V281" stroke="#38BDF8" stroke-opacity=".18" stroke-width="1"/>
  </g>
  <circle cx="1020" cy="92" r="3" fill="#10B981" fill-opacity=".8"/>
  <circle cx="1110" cy="240" r="2" fill="#22D3EE" fill-opacity=".8"/>

  <svg x="28" y="10" width="420" height="300" viewBox="40 98 432 316" role="img" aria-label="ORBITA orbital emblem">
    <g transform="rotate(-18 256 256)">
      <path fill="url(#mark-orbit-gradient)" fill-rule="evenodd"
        d="M51 256A205 54 0 1 0 461 256A205 54 0 1 0 51 256Z
           M53 252A203 44 0 1 0 459 252A203 44 0 1 0 53 252Z"/>
    </g>
    <path fill="url(#mark-gradient)"
      d="M256 148A108 108 0 0 0 256 364A86 108 0 0 1 256 148Z
         M256 148A108 108 0 0 1 256 364A86 108 0 0 0 256 148Z"/>
    <ellipse cx="256" cy="256" rx="68" ry="94" fill="none" stroke="url(#mark-gradient)" stroke-width="3"/>
    <path fill="#D6ECFF" d="M256 112Q262 256 256 400Q250 256 256 112Z"/>
    <path fill="#D6ECFF"
      d="M256 218Q263 249 290 256Q263 263 256 294Q249 263 222 256Q249 249 256 218Z"/>
    <g transform="rotate(-18 256 256)">
      <g clip-path="url(#mark-front)">
        <path fill="url(#mark-orbit-gradient)" fill-rule="evenodd"
          d="M51 256A205 54 0 1 0 461 256A205 54 0 1 0 51 256Z
             M53 252A203 44 0 1 0 459 252A203 44 0 1 0 53 252Z"/>
      </g>
    </g>
  </svg>

  <text x="482" y="92" fill="#7DD3FC" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">DEEP-SPACE CREW HEALTH SYSTEM</text>
  <text x="478" y="157" fill="url(#banner-wordmark)" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="7">ORBITA</text>
  <text x="482" y="188" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400">Onboard Remote Biometric &amp; Integrated Telemetry Assistant</text>

  <g font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">
    <rect x="482" y="213" width="153" height="30" rx="15" fill="#0F172A" fill-opacity=".84" stroke="#22D3EE" stroke-opacity=".38"/>
    <circle cx="498" cy="228" r="3.5" fill="#10B981"/>
    <text x="509" y="232" fill="#CFFAFE">OFFLINE-FIRST</text>

    <rect x="645" y="213" width="207" height="30" rx="15" fill="#0F172A" fill-opacity=".84" stroke="#22D3EE" stroke-opacity=".32"/>
    <path d="M660 228l4 4 7-8" fill="none" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="678" y="232" fill="#CFFAFE">DETERMINISTIC SAFETY</text>

    <rect x="862" y="213" width="190" height="30" rx="15" fill="#0F172A" fill-opacity=".84" stroke="#10B981" stroke-opacity=".32"/>
    <circle cx="878" cy="228" r="3.5" fill="#38BDF8"/>
    <text x="889" y="232" fill="#CFFAFE">LOCAL NEURAL ENGINE</text>
  </g>

  <path d="M482 271H1052" stroke="#334155" stroke-opacity=".7"/>
  <text x="482" y="291" fill="#94A3B8" font-family="JetBrains Mono, Consolas, monospace" font-size="10" letter-spacing="1.2">RULES SET STATUS &amp; URGENCY</text>
  <circle cx="701" cy="287" r="2" fill="#10B981"/>
  <text x="716" y="291" fill="#94A3B8" font-family="JetBrains Mono, Consolas, monospace" font-size="10" letter-spacing="1.2">AI ADDS CLINICAL CONTEXT</text>
</svg>
